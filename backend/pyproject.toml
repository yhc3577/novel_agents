[project]
name = "novel-agents-backend"
version = "0.1.0"
description = "Novel Agents backend (FastAPI + asyncio + LangGraph)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "python-dotenv>=1.0",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "langchain-openai>=0.2",
    "langgraph>=1.0",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]
# 演示脚本 scripts/demo_flow.py 的客户端依赖
demo = [
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
