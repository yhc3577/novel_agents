services:
  postgres:
    image: postgres:16
    container_name: novel_agents_pg
    environment:
      POSTGRES_USER: novel
      POSTGRES_PASSWORD: novel
      POSTGRES_DB: novel_agents
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novel -d novel_agents"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
